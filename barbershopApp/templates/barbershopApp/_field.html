<div class="field{% if field.errors %} has-error{% endif %}{% if wide %} field-wide{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="optional">(facultatif)</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<small class="help">{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}
</div>
